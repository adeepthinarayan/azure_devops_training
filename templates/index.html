<!DOCTYPE html>
<html>
<head>
    <title>Employee Directory</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
            padding:40px;
        }

        table{
            width:70%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid gray;
            padding:10px;
        }

        th{
            background:#0078D4;
            color:white;
        }

    </style>

</head>

<body>

<h1>Employee Directory</h1>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Department</th>
</tr>

{% for emp in employees %}

<tr>
<td>{{emp.id}}</td>
<td>{{emp.name}}</td>
<td>{{emp.department}}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
